# STAGE 1 — EVERY configuration the code can run, on the 6 datasets verified to fit 32GB.
#
# 11 models x 6 datasets (PGPR on ml100k/ml1m only) x 3 seeds = 186 model fits, plus 180
# explainer runs. This is the complete experiment minus the two deferred datasets:
#   - EBPR family, all 5 engine variants: BPR_ebpr, UBPR, EBPR, pUEBPR, UEBPR
#   - PGPR (ml100k/ml1m — the only datasets with a KG)
#   - RecBole Tier 2: Pop, BPR, MultiVAE, NeuMF, SLIM
#   - AR + KNN explainers on every RecBole model (they are gated to RecBole models by
#     isinstance() in explainers/*.py — EBPR/PGPR cannot be explained by them; PGPR has
#     its own native explain()).
# Nothing else is wired in. See REGISTRY.md for what is deliberately excluded and why.
#
# configs/full.yaml restricted to the six datasets that are verified runnable at full scale
# inside 32GB of RAM. `ambar` and `amazon_digital_music` are deferred to a later stage:
#
#   ambar   — SOLVED, not blocked. loader: ambar_artist reaches 15.1 GB with 100% of the
#             3,311,462 ratings retained (measured). It is held back only to sequence the
#             runs; re-including it is a copy-paste of its block from full.yaml.
#   amazon_digital_music — genuinely unresolved. 130,434 interactions over 100,952 users
#             (1.3/user, 87.3% with fewer than 2) needs 96.7 GB unfiltered, and no k-core
#             threshold rescues it (>=5 leaves 523 users and 1.1% of the data). Needs a
#             larger dump or exclusion — a decision, not a setting.
#
# See README's "Full-scale memory" section for the measured table behind both.
#
# Splits live under data/splits/full/<dataset>, mirroring data/splits/smoke_test/<dataset>
# — same store_dir as full.yaml, so splits materialized here are reused verbatim by the
# full 8-dataset configs later without recomputation.
#
# Run from the rexbench repo root (on the Studio, after rsyncing data/splits/):
#   rexbench run --config configs/stage1_full.yaml


experiment:
  name: stage1_full
  output_dir: rexbench/outputs

determinism:
  seeds: [2020, 42, 7]
  reproducibility: true
  device: auto

datasets:
  - name: ml100k
    loader: ml100k
    raw_path: data/raw/ml100k/u.data
    split: {strategy: random, val_size: 0.1, test_size: 0.2, random_state: 200, store_dir: data/splits/full/ml100k}
    topk: [5, 10]
    tail_fraction: 0.20
    kg: {status: available, source_dir: data/raw/pgpr_kg/ml100k}

  - name: ml1m
    loader: ml1m
    raw_path: data/raw/ml1m/ratings.dat
    split: {strategy: random, val_size: 0.1, test_size: 0.2, random_state: 200, store_dir: data/splits/full/ml1m}
    topk: [5, 10]
    tail_fraction: 0.20
    kg: {status: available, source_dir: data/raw/pgpr_kg/ml1m}

  - name: coat
    loader: coat
    raw_path: {train: data/raw/coat/train.ascii, test: data/raw/coat/test.ascii}
    split: {strategy: random, val_size: 0.1, test_size: 0.2, random_state: 200, store_dir: data/splits/full/coat}
    topk: [5, 10]
    tail_fraction: 0.20
    kg: {status: needs_construction}

  - name: electronics
    loader: electronics
    raw_path: data/raw/electronics/df_electronics.csv
    split: {strategy: random, val_size: 0.1, test_size: 0.2, random_state: 200, store_dir: data/splits/full/electronics}
    topk: [5, 10]
    tail_fraction: 0.20
    kg: {status: needs_construction}

  - name: rentrunway
    loader: rentrunway
    raw_path: data/raw/rentrunway/renttherunway_final_data.json
    split: {strategy: random, val_size: 0.1, test_size: 0.2, random_state: 200, store_dir: data/splits/full/rentrunway}
    topk: [5, 10]
    tail_fraction: 0.20
    kg: {status: needs_construction}

  - name: lastfm1k
    loader: lastfm1k_artist
    raw_path: data/raw/lastfm1k/userid-timestamp-artid-artname-traid-traname.tsv
    filter: {min_item_interactions: 20}   # 961,417 tracks -> 35,474 artists; see README "LastFM1K memory"
    split: {strategy: random, val_size: 0.1, test_size: 0.2, random_state: 200, store_dir: data/splits/full/lastfm1k}
    topk: [5, 10]
    tail_fraction: 0.20
    kg: {status: needs_construction}

models:
  # electronics/rentrunway/amazon_digital_music are far too sparse for the default
  # precondition (79.6% / 68.0% / 87.3% of users have <2 interactions). Rather than skip
  # them, this override lets EBPR/UBPR/UEBPR actually attempt training there: a much lower
  # sparsity floor (0.05 — all three clear it) plus a smaller item neighborhood (5, down
  # from 20) so create_neighborhood's cosine-similarity signal isn't diluted by
  # mostly-empty co-occurrence on this data. Expected to produce a real but weak/degenerate
  # explainability signal, not a crash — same class of disclosed finding as the AR
  # explainer's model_fidelity=0.0 on these same three datasets. Defined once and aliased
  # below so EBPR/UBPR/UEBPR share the exact same override.
  - name: EBPR
    tier: 1
    adapter: ebpr
    variant: EBPR
    applies_to: all_datasets
    hyperparameters: {num_epoch: 50, batch_size: 512, lr: 0.001, num_latent: 8, neighborhood: 20, optimizer: adam, eval_every: 5}
    precondition: {min_fraction_users_with_2plus: 0.5}
    dataset_overrides: &sparse_ebpr_overrides
      electronics:
        hyperparameters: {num_epoch: 50, batch_size: 512, lr: 0.001, num_latent: 8, neighborhood: 5, optimizer: adam, eval_every: 5}
        precondition: {min_fraction_users_with_2plus: 0.05}
      rentrunway:
        hyperparameters: {num_epoch: 50, batch_size: 512, lr: 0.001, num_latent: 8, neighborhood: 5, optimizer: adam, eval_every: 5}
        precondition: {min_fraction_users_with_2plus: 0.05}

  - name: UBPR
    tier: 1
    adapter: ebpr
    variant: UBPR
    applies_to: all_datasets
    hyperparameters: {num_epoch: 50, batch_size: 512, lr: 0.001, num_latent: 8, neighborhood: 20, optimizer: adam, eval_every: 5}
    precondition: {min_fraction_users_with_2plus: 0.5}
    dataset_overrides: *sparse_ebpr_overrides

  - name: UEBPR
    tier: 1
    adapter: ebpr
    variant: UEBPR
    applies_to: all_datasets
    hyperparameters: {num_epoch: 50, batch_size: 512, lr: 0.001, num_latent: 8, neighborhood: 20, optimizer: adam, eval_every: 5}
    precondition: {min_fraction_users_with_2plus: 0.5}
    dataset_overrides: *sparse_ebpr_overrides

  # The EBPR codebase's engine supports FIVE variants
  # (external/ebpr/Code/engine_EBPR.py: ['BPR','UBPR','EBPR','pUEBPR','UEBPR']); these two
  # complete the family.
  #
  # BPR_ebpr is named to disambiguate it from the Tier 2 `BPR` below, which is RecBole's
  # implementation — they are two different codebases and would otherwise collide in
  # results.parquet's `model` column. README's model table already listed
  # "BPR/EBPR/UBPR/UEBPR" as Tier 1, but no config actually ran the BPR half until now.
  - name: BPR_ebpr
    tier: 1
    adapter: ebpr
    variant: BPR
    applies_to: all_datasets
    hyperparameters: {num_epoch: 50, batch_size: 512, lr: 0.001, num_latent: 8, neighborhood: 20, optimizer: adam, eval_every: 5}
    precondition: {min_fraction_users_with_2plus: 0.5}
    dataset_overrides: *sparse_ebpr_overrides

  # pUEBPR is the one variant never named in the original Tier 1 list — it is included here
  # because this config is "everything the code can run", but flag it as such if reported.
  - name: pUEBPR
    tier: 1
    adapter: ebpr
    variant: pUEBPR
    applies_to: all_datasets
    hyperparameters: {num_epoch: 50, batch_size: 512, lr: 0.001, num_latent: 8, neighborhood: 20, optimizer: adam, eval_every: 5}
    precondition: {min_fraction_users_with_2plus: 0.5}
    dataset_overrides: *sparse_ebpr_overrides

  - name: PGPR
    tier: 1
    adapter: pgpr
    applies_to: [ml100k, ml1m]
    hyperparameters: {transe_epochs: 30, transe_batch_size: 64, agent_epochs: 50, agent_batch_size: 32}
    precondition: {min_kg_triples: 1000}

  # Tier 2 — the predecessor pipeline's original baselines (AUDIT.md section 1.1). Trivial
  # cost to wire in (see the plan's Tier 2 cost assessment): one RecBoleModelAdapter,
  # parameterized here.
  - name: Pop
    tier: 2
    adapter: recbole
    recbole_model: Pop
    applies_to: all_datasets
    hyperparameters: {epochs: 1}  # AUDIT.md 4.6: pre-existing patch, preserved

  - name: BPR
    tier: 2
    adapter: recbole
    recbole_model: BPR
    applies_to: all_datasets
    hyperparameters: {}

  - name: MultiVAE
    tier: 2
    adapter: recbole
    recbole_model: MultiVAE
    applies_to: all_datasets
    hyperparameters: {}

  - name: NeuMF
    tier: 2
    adapter: recbole
    recbole_model: NeuMF
    applies_to: all_datasets
    hyperparameters: {}

  - name: SLIM
    tier: 2
    adapter: recbole
    recbole_model: SLIMElastic
    applies_to: all_datasets
    hyperparameters: {epochs: 50}  # AUDIT.md 4.6/5.3: pre-existing convergence patch, preserved

explainers:
  - name: AR
    adapter: recoxplainer_ar
    applies_to_models: [Pop, BPR, MultiVAE, NeuMF, SLIM]
    hyperparameters:
      min_support: 0.001
      max_len: 2
      metric: lift
      min_threshold: 0.001
      min_confidence: 0.001
      min_lift: 0.001

  - name: KNN
    adapter: recoxplainer_knn
    applies_to_models: [Pop, BPR, MultiVAE, NeuMF, SLIM]
    hyperparameters: {knn: 10}

metrics:
  accuracy: [ndcg, map]
  # gini/variance here are USER-side (inequality of per-user NDCG); the item_* /
  # tail_* entries are item-side (how exposure spreads over the catalog).
  fairness: [gini, variance, entropy, arp, arp_normalized, tail_coverage,
             item_coverage, item_exposure_gini, tail_item_coverage, tail_exposure_share]
  explanation: [fidelity, tail_coverage, diversity, explanation_arp, coverage, personalization]

statistics:
  tests: [friedman, quade, nemenyi, kendall_w]
  alpha: 0.05
