# STAGE 1 — Tier 1, 6 datasets — LOCAL raw paths, for materializing splits
#
# configs/tier1_local.yaml restricted to the six datasets that are verified runnable at full scale
# inside 32GB of RAM. `ambar` and `amazon_digital_music` are deferred to a later stage:
#
#   ambar   — SOLVED, not blocked. loader: ambar_artist reaches 15.1 GB with 100% of the
#             3,311,462 ratings retained (measured). It is held back only to sequence the
#             runs; re-including it is a copy-paste of its block from tier1_local.yaml.
#   amazon_digital_music — genuinely unresolved. 130,434 interactions over 100,952 users
#             (1.3/user, 87.3% with fewer than 2) needs 96.7 GB unfiltered, and no k-core
#             threshold rescues it (>=5 leaves 523 users and 1.1% of the data). Needs a
#             larger dump or exclusion — a decision, not a setting.
#
# See README's "Full-scale memory" section for the measured table behind both.
#
# Splits live under data/splits/full/<dataset>, mirroring data/splits/smoke_test/<dataset>
# — same store_dir as tier1_local.yaml, so splits materialized here are reused verbatim by the
# full 8-dataset configs later without recomputation.
#
# Run from the rexbench repo root:
#   rexbench split --config configs/stage1_tier1_local.yaml     # materialize data/splits/full/<dataset>
#   rsync -avz data/splits/ my-studio:rexbench/data/splits/


experiment:
  name: stage1_tier1_local
  output_dir: rexbench/outputs

determinism:
  seeds: [2020, 42, 7]
  reproducibility: true
  device: auto

datasets:
  - name: ml100k
    loader: ml100k
    raw_path: ../datasets/ML100K/ml-100k/u.data
    split: {strategy: random, val_size: 0.1, test_size: 0.2, random_state: 200, store_dir: data/splits/full/ml100k}
    topk: [5, 10]
    tail_fraction: 0.20
    kg: {status: available, source_dir: data/raw/pgpr_kg/ml100k}

  - name: ml1m
    loader: ml1m
    raw_path: ../datasets/ML1M/ml-1m/ratings.dat
    split: {strategy: random, val_size: 0.1, test_size: 0.2, random_state: 200, store_dir: data/splits/full/ml1m}
    topk: [5, 10]
    tail_fraction: 0.20
    kg: {status: available, source_dir: data/raw/pgpr_kg/ml1m}

  - name: coat
    loader: coat
    raw_path: {train: ../datasets/Coat/train.ascii, test: ../datasets/Coat/test.ascii}
    split: {strategy: random, val_size: 0.1, test_size: 0.2, random_state: 200, store_dir: data/splits/full/coat}
    topk: [5, 10]
    tail_fraction: 0.20
    kg: {status: needs_construction}  # item_features_map.txt has gender/jackettype/color, no extractor yet

  - name: electronics
    loader: electronics
    raw_path: ../datasets/MarketBias/df_electronics.csv
    split: {strategy: random, val_size: 0.1, test_size: 0.2, random_state: 200, store_dir: data/splits/full/electronics}
    topk: [5, 10]
    tail_fraction: 0.20
    kg: {status: needs_construction}  # category/brand/model_attr present, no extractor yet

  - name: rentrunway
    loader: rentrunway
    raw_path: ../datasets/Clothes/renttherunway_final_data.json
    split: {strategy: random, val_size: 0.1, test_size: 0.2, random_state: 200, store_dir: data/splits/full/rentrunway}
    topk: [5, 10]
    tail_fraction: 0.20
    kg: {status: needs_construction}  # category/fit/size present, no extractor yet

  - name: lastfm1k
    loader: lastfm1k_artist
    raw_path: ../datasets/LastFM1K/lastfm-dataset-1K/userid-timestamp-artid-artname-traid-traname.tsv
    filter: {min_item_interactions: 20}   # 961,417 tracks -> 35,474 artists; see README "LastFM1K memory"
    split: {strategy: random, val_size: 0.1, test_size: 0.2, random_state: 200, store_dir: data/splits/full/lastfm1k}
    topk: [5, 10]
    tail_fraction: 0.20
    kg: {status: needs_construction}  # PGPR's own KG relation registry already defines a LASTFM_KG_RELATION schema, but no KG data files exist yet

models:
  # electronics/rentrunway/amazon_digital_music are far too sparse for the default
  # precondition (79.6% / 68.0% / 87.3% of users have <2 interactions — see the session
  # that diagnosed this). Rather than skip them, this override lets EBPR/UBPR/UEBPR
  # actually attempt training there: a much lower sparsity floor (0.05 — all three clear
  # it) plus a smaller item neighborhood (5, down from 20) so create_neighborhood's
  # cosine-similarity signal isn't diluted by mostly-empty co-occurrence on this data.
  # This is expected to produce a real but weak/degenerate explainability signal, not a
  # crash — the same class of disclosed finding as the AR explainer's model_fidelity=0.0
  # on these same three datasets. Defined once and aliased below so EBPR/UBPR/UEBPR share
  # the exact same override (not three independently-edited copies).
  - name: EBPR
    tier: 1
    adapter: ebpr
    variant: EBPR
    applies_to: all_datasets
    hyperparameters:
      num_epoch: 50
      batch_size: 512
      lr: 0.001
      num_latent: 8
      neighborhood: 20
      optimizer: adam
    precondition: {min_fraction_users_with_2plus: 0.5}
    dataset_overrides: &sparse_ebpr_overrides
      electronics:
        hyperparameters: {num_epoch: 50, batch_size: 512, lr: 0.001, num_latent: 8, neighborhood: 5, optimizer: adam}
        precondition: {min_fraction_users_with_2plus: 0.05}
      rentrunway:
        hyperparameters: {num_epoch: 50, batch_size: 512, lr: 0.001, num_latent: 8, neighborhood: 5, optimizer: adam}
        precondition: {min_fraction_users_with_2plus: 0.05}

  - name: UBPR
    tier: 1
    adapter: ebpr
    variant: UBPR
    applies_to: all_datasets
    hyperparameters:
      num_epoch: 50
      batch_size: 512
      lr: 0.001
      num_latent: 8
      neighborhood: 20
      optimizer: adam
    precondition: {min_fraction_users_with_2plus: 0.5}
    dataset_overrides: *sparse_ebpr_overrides

  - name: UEBPR
    tier: 1
    adapter: ebpr
    variant: UEBPR
    applies_to: all_datasets
    hyperparameters:
      num_epoch: 50
      batch_size: 512
      lr: 0.001
      num_latent: 8
      neighborhood: 20
      optimizer: adam
    precondition: {min_fraction_users_with_2plus: 0.5}
    dataset_overrides: *sparse_ebpr_overrides

  # PGPR: applies_to restricted to the datasets with an available pre-linked KG.
  # See REGISTRY.md for why the other 6 datasets aren't listed here yet.
  - name: PGPR
    tier: 1
    adapter: pgpr
    applies_to: [ml100k, ml1m]
    hyperparameters:
      transe_epochs: 30
      transe_batch_size: 64
      agent_epochs: 50
      agent_batch_size: 32
    precondition: {min_kg_triples: 1000}

explainers: []

metrics:
  accuracy: [ndcg, map]
  # gini/variance here are USER-side (inequality of per-user NDCG); the item_* /
  # tail_* entries are item-side (how exposure spreads over the catalog).
  fairness: [gini, variance, entropy, arp, arp_normalized, tail_coverage,
             item_coverage, item_exposure_gini, tail_item_coverage, tail_exposure_share]

statistics:
  tests: [friedman, quade, nemenyi, kendall_w]
  alpha: 0.05
