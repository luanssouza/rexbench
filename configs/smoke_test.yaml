# Smoke test: every model we have, on every dataset it applies to, at a tiny scale — just
# to confirm the pipeline runs end-to-end on a new environment (e.g. a fresh Lightning AI
# Studio) before spending real compute on configs/tier1.yaml or configs/full.yaml.
#
# `sample: {max_users: 100, max_interactions_per_user: 30}` on every dataset keeps things
# small AND safe: max_users alone is NOT enough for lastfm1k specifically (verified: 150
# sampled users there still touch 334,000 distinct items on their own, ~900GB for EBPR's
# item x item similarity matrix) — max_interactions_per_user is what actually bounds the
# item catalog for datasets with huge per-user interaction counts. This is pure
# pipeline-level data reduction (core/dataset.py), it never touches any model's
# training/scoring code — see SampleConfig's docstring.
#
# Every hyperparameter here is deliberately tiny (1-2 epochs, small batches/latent dims) —
# this config is for "does it run," not for real results. Single seed, no explainers.
#
# Run from the rexbench repo root: `rexbench run --config configs/smoke_test.yaml`

experiment:
  name: smoke_test
  output_dir: rexbench/outputs

determinism:
  seeds: [2020]
  reproducibility: true
  device: auto

datasets:
  - name: ml100k
    loader: ml100k
    raw_path: data/raw/ml100k/u.data
    sample: {max_users: 100, max_interactions_per_user: 30, seed: 200}
    split: {strategy: random, val_size: 0.1, test_size: 0.2, random_state: 200}
    topk: [5, 10]
    tail_fraction: 0.20
    kg: {status: available, source_dir: data/raw/pgpr_kg/ml100k}

  - name: ml1m
    loader: ml1m
    raw_path: data/raw/ml1m/ratings.dat
    sample: {max_users: 100, max_interactions_per_user: 30, seed: 200}
    split: {strategy: random, val_size: 0.1, test_size: 0.2, random_state: 200}
    topk: [5, 10]
    tail_fraction: 0.20
    kg: {status: available, source_dir: data/raw/pgpr_kg/ml1m}

  - name: coat
    loader: coat
    raw_path: {train: data/raw/coat/train.ascii, test: data/raw/coat/test.ascii}
    sample: {max_users: 100, max_interactions_per_user: 30, seed: 200}
    split: {strategy: random, val_size: 0.1, test_size: 0.2, random_state: 200}
    topk: [5, 10]
    tail_fraction: 0.20
    kg: {status: needs_construction}

  - name: electronics
    loader: electronics
    raw_path: data/raw/electronics/df_electronics.csv
    sample: {max_users: 100, max_interactions_per_user: 30, seed: 200}
    split: {strategy: random, val_size: 0.1, test_size: 0.2, random_state: 200}
    topk: [5, 10]
    tail_fraction: 0.20
    kg: {status: needs_construction}

  - name: rentrunway
    loader: rentrunway
    raw_path: data/raw/rentrunway/renttherunway_final_data.json
    sample: {max_users: 100, max_interactions_per_user: 30, seed: 200}
    split: {strategy: random, val_size: 0.1, test_size: 0.2, random_state: 200}
    topk: [5, 10]
    tail_fraction: 0.20
    kg: {status: needs_construction}

  - name: ambar
    loader: ambar
    raw_path: data/raw/ambar/ratings_info.csv
    sample: {max_users: 100, max_interactions_per_user: 30, seed: 200}
    split: {strategy: random, val_size: 0.1, test_size: 0.2, random_state: 200}
    topk: [5, 10]
    tail_fraction: 0.20
    kg: {status: needs_construction}

  - name: lastfm1k
    loader: lastfm1k
    raw_path: data/raw/lastfm1k/userid-timestamp-artid-artname-traid-traname.tsv
    sample: {max_users: 100, max_interactions_per_user: 30, seed: 200}
    split: {strategy: random, val_size: 0.1, test_size: 0.2, random_state: 200}
    topk: [5, 10]
    tail_fraction: 0.20
    kg: {status: needs_construction}

  - name: amazon_digital_music
    loader: amazon_digital_music
    raw_path: data/raw/amazon_digital_music/Digital_Music.jsonl
    sample: {max_users: 100, max_interactions_per_user: 30, seed: 200}
    split: {strategy: random, val_size: 0.1, test_size: 0.2, random_state: 200}
    topk: [5, 10]
    tail_fraction: 0.20
    kg: {status: unsupported}

models:
  # EBPR family (Tier 1, required). Sampling preserves each dataset's real sparsity
  # proportion, so electronics/rentrunway/amazon_digital_music still need the lower
  # precondition floor + smaller neighborhood, same as tier1.yaml/full.yaml.
  - name: EBPR
    tier: 1
    adapter: ebpr
    variant: EBPR
    applies_to: all_datasets
    hyperparameters: {num_epoch: 2, batch_size: 32, lr: 0.001, num_latent: 4, neighborhood: 5, optimizer: adam}
    precondition: {min_fraction_users_with_2plus: 0.5}
    dataset_overrides: &sparse_ebpr_overrides
      electronics:
        hyperparameters: {num_epoch: 2, batch_size: 32, lr: 0.001, num_latent: 4, neighborhood: 3, optimizer: adam}
        precondition: {min_fraction_users_with_2plus: 0.05}
      rentrunway:
        hyperparameters: {num_epoch: 2, batch_size: 32, lr: 0.001, num_latent: 4, neighborhood: 3, optimizer: adam}
        precondition: {min_fraction_users_with_2plus: 0.05}
      amazon_digital_music:
        hyperparameters: {num_epoch: 2, batch_size: 32, lr: 0.001, num_latent: 4, neighborhood: 3, optimizer: adam}
        precondition: {min_fraction_users_with_2plus: 0.05}

  - name: UBPR
    tier: 1
    adapter: ebpr
    variant: UBPR
    applies_to: all_datasets
    hyperparameters: {num_epoch: 2, batch_size: 32, lr: 0.001, num_latent: 4, neighborhood: 5, optimizer: adam}
    precondition: {min_fraction_users_with_2plus: 0.5}
    dataset_overrides: *sparse_ebpr_overrides

  - name: UEBPR
    tier: 1
    adapter: ebpr
    variant: UEBPR
    applies_to: all_datasets
    hyperparameters: {num_epoch: 2, batch_size: 32, lr: 0.001, num_latent: 4, neighborhood: 5, optimizer: adam}
    precondition: {min_fraction_users_with_2plus: 0.5}
    dataset_overrides: *sparse_ebpr_overrides

  # PGPR (Tier 1, required). Does NOT use `sample` — trains on its own pre-existing
  # on-disk ml100k/ml1m data regardless (disclosed scope limitation, REGISTRY.md) — so this
  # is "small" only in the sense of 1 epoch each, not a reduced dataset. Still the two only
  # datasets with an available KG.
  - name: PGPR
    tier: 1
    adapter: pgpr
    applies_to: [ml100k, ml1m]
    hyperparameters: {transe_epochs: 1, transe_batch_size: 32, agent_epochs: 1, agent_batch_size: 16}
    precondition: {min_kg_triples: 1000}

  # Tier 2 baselines — embedding/batched, no O(items^2) matrix, so `sample` alone (no
  # dataset_overrides needed) keeps these fast everywhere.
  - name: Pop
    tier: 2
    adapter: recbole
    recbole_model: Pop
    applies_to: all_datasets
    hyperparameters: {epochs: 1}

  - name: BPR
    tier: 2
    adapter: recbole
    recbole_model: BPR
    applies_to: all_datasets
    hyperparameters: {epochs: 1}

  - name: MultiVAE
    tier: 2
    adapter: recbole
    recbole_model: MultiVAE
    applies_to: all_datasets
    hyperparameters: {epochs: 1}

  - name: NeuMF
    tier: 2
    adapter: recbole
    recbole_model: NeuMF
    applies_to: all_datasets
    hyperparameters: {epochs: 1}

  - name: SLIM
    tier: 2
    adapter: recbole
    recbole_model: SLIMElastic
    applies_to: all_datasets
    hyperparameters: {epochs: 1}

explainers:
  - name: AR
    adapter: recoxplainer_ar
    applies_to_models: [Pop, BPR, MultiVAE, NeuMF, SLIM]
    hyperparameters:
      min_support: 0.001
      max_len: 2
      metric: lift
      min_threshold: 0.001
      min_confidence: 0.001
      min_lift: 0.001

  - name: KNN
    adapter: recoxplainer_knn
    applies_to_models: [Pop, BPR, MultiVAE, NeuMF, SLIM]
    hyperparameters: {knn: 5}

metrics:
  accuracy: [ndcg, map]
  fairness: [gini, variance, entropy, arp, arp_normalized, tail_coverage]

statistics:
  tests: [friedman, quade, nemenyi, kendall_w]
  alpha: 0.05
