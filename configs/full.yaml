# Full config: Tier 1 (EBPR family + PGPR) plus Tier 2 (Pop/BPR/MultiVAE/NeuMF/SLIM,
# ReXFair's original baselines — AUDIT.md's model x dataset matrix) with AR/KNN post-hoc
# explainers applied to every Tier 2 model.
# Run from the repo root (measuring/): `rexbench run --config rexbench/configs/full.yaml`

experiment:
  name: full
  output_dir: rexbench/outputs

determinism:
  seeds: [2020, 42, 7]
  reproducibility: true
  device: auto

datasets:
  - name: ml100k
    loader: ml100k
    raw_path: datasets/ML100K/ml-100k/u.data
    split: {strategy: random, val_size: 0.1, test_size: 0.2, random_state: 200}
    topk: [5, 10]
    tail_fraction: 0.20
    kg: {status: available, source_dir: baselines/explanation-quality-recsys/datasets/ml100k}

  - name: ml1m
    loader: ml1m
    raw_path: datasets/ML1M/ml-1m/ratings.dat
    split: {strategy: random, val_size: 0.1, test_size: 0.2, random_state: 200}
    topk: [5, 10]
    tail_fraction: 0.20
    kg: {status: available, source_dir: baselines/explanation-quality-recsys/datasets/ml1m}

  - name: coat
    loader: coat
    raw_path: {train: datasets/Coat/train.ascii, test: datasets/Coat/test.ascii}
    split: {strategy: random, val_size: 0.1, test_size: 0.2, random_state: 200}
    topk: [5, 10]
    tail_fraction: 0.20
    kg: {status: needs_construction}

  - name: electronics
    loader: electronics
    raw_path: datasets/MarketBias/df_electronics.csv
    split: {strategy: random, val_size: 0.1, test_size: 0.2, random_state: 200}
    topk: [5, 10]
    tail_fraction: 0.20
    kg: {status: needs_construction}

  - name: rentrunway
    loader: rentrunway
    raw_path: datasets/Clothes/renttherunway_final_data.json
    split: {strategy: random, val_size: 0.1, test_size: 0.2, random_state: 200}
    topk: [5, 10]
    tail_fraction: 0.20
    kg: {status: needs_construction}

  - name: ambar
    loader: ambar
    raw_path: datasets/AMBAR/data/AMBAR/ratings_info.csv
    split: {strategy: random, val_size: 0.1, test_size: 0.2, random_state: 200}
    topk: [5, 10]
    tail_fraction: 0.20
    kg: {status: needs_construction}

  - name: lastfm1k
    loader: lastfm1k
    raw_path: datasets/LastFM1K/lastfm-dataset-1K/userid-timestamp-artid-artname-traid-traname.tsv
    split: {strategy: random, val_size: 0.1, test_size: 0.2, random_state: 200}
    topk: [5, 10]
    tail_fraction: 0.20
    kg: {status: needs_construction}

  - name: amazon_digital_music
    loader: amazon_digital_music
    raw_path: datasets/Amazon/Digital_Music.jsonl
    split: {strategy: random, val_size: 0.1, test_size: 0.2, random_state: 200}
    topk: [5, 10]
    tail_fraction: 0.20
    kg: {status: unsupported}

models:
  - name: EBPR
    tier: 1
    adapter: ebpr
    variant: EBPR
    applies_to: all_datasets
    hyperparameters: {num_epoch: 50, batch_size: 512, lr: 0.001, num_latent: 8, neighborhood: 20, optimizer: adam}
    precondition: {min_fraction_users_with_2plus: 0.5}

  - name: UBPR
    tier: 1
    adapter: ebpr
    variant: UBPR
    applies_to: all_datasets
    hyperparameters: {num_epoch: 50, batch_size: 512, lr: 0.001, num_latent: 8, neighborhood: 20, optimizer: adam}
    precondition: {min_fraction_users_with_2plus: 0.5}

  - name: UEBPR
    tier: 1
    adapter: ebpr
    variant: UEBPR
    applies_to: all_datasets
    hyperparameters: {num_epoch: 50, batch_size: 512, lr: 0.001, num_latent: 8, neighborhood: 20, optimizer: adam}
    precondition: {min_fraction_users_with_2plus: 0.5}

  - name: PGPR
    tier: 1
    adapter: pgpr
    applies_to: [ml100k, ml1m]
    hyperparameters: {transe_epochs: 30, transe_batch_size: 64, agent_epochs: 50, agent_batch_size: 32}
    precondition: {min_kg_triples: 1000}

  # Tier 2 — ReXFair's original baselines (AUDIT.md section 1.1). Trivial cost to wire in
  # (see the plan's Tier 2 cost assessment): one RecBoleModelAdapter, parameterized here.
  - name: Pop
    tier: 2
    adapter: recbole
    recbole_model: Pop
    applies_to: all_datasets
    hyperparameters: {epochs: 1}  # AUDIT.md 4.6: pre-existing rexfair patch, preserved

  - name: BPR
    tier: 2
    adapter: recbole
    recbole_model: BPR
    applies_to: all_datasets
    hyperparameters: {}

  - name: MultiVAE
    tier: 2
    adapter: recbole
    recbole_model: MultiVAE
    applies_to: all_datasets
    hyperparameters: {}

  - name: NeuMF
    tier: 2
    adapter: recbole
    recbole_model: NeuMF
    applies_to: all_datasets
    hyperparameters: {}

  - name: SLIM
    tier: 2
    adapter: recbole
    recbole_model: SLIMElastic
    applies_to: all_datasets
    hyperparameters: {epochs: 50}  # AUDIT.md 4.6/5.3: pre-existing rexfair convergence patch, preserved

explainers:
  - name: AR
    adapter: recoxplainer_ar
    applies_to_models: [Pop, BPR, MultiVAE, NeuMF, SLIM]
    hyperparameters:
      min_support: 0.001
      max_len: 2
      metric: lift
      min_threshold: 0.001
      min_confidence: 0.001
      min_lift: 0.001

  - name: KNN
    adapter: recoxplainer_knn
    applies_to_models: [Pop, BPR, MultiVAE, NeuMF, SLIM]
    hyperparameters: {knn: 10}

metrics:
  accuracy: [ndcg, map]
  fairness: [gini, variance, entropy, arp, arp_normalized, tail_coverage]
  explanation: [fidelity, tail_coverage, diversity, explanation_arp, coverage, personalization]

statistics:
  tests: [friedman, quade, nemenyi, kendall_w]
  alpha: 0.05
