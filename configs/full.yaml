# Full config: Tier 1 (EBPR family + PGPR) plus Tier 2 (Pop/BPR/MultiVAE/NeuMF/SLIM,
# the predecessor pipeline's original baselines — AUDIT.md's model x dataset matrix) with
# AR/KNN post-hoc explainers applied to every Tier 2 model.
# Run from the rexbench repo root: `rexbench run --config configs/full.yaml`

experiment:
  name: full
  output_dir: rexbench/outputs

determinism:
  seeds: [2020, 42, 7]
  reproducibility: true
  device: auto

datasets:
  - name: ml100k
    loader: ml100k
    raw_path: data/raw/ml100k/u.data
    split: {strategy: random, val_size: 0.1, test_size: 0.2, random_state: 200, store_dir: data/splits/ml100k}
    topk: [5, 10]
    tail_fraction: 0.20
    kg: {status: available, source_dir: data/raw/pgpr_kg/ml100k}

  - name: ml1m
    loader: ml1m
    raw_path: data/raw/ml1m/ratings.dat
    split: {strategy: random, val_size: 0.1, test_size: 0.2, random_state: 200, store_dir: data/splits/ml1m}
    topk: [5, 10]
    tail_fraction: 0.20
    kg: {status: available, source_dir: data/raw/pgpr_kg/ml1m}

  - name: coat
    loader: coat
    raw_path: {train: data/raw/coat/train.ascii, test: data/raw/coat/test.ascii}
    split: {strategy: random, val_size: 0.1, test_size: 0.2, random_state: 200, store_dir: data/splits/coat}
    topk: [5, 10]
    tail_fraction: 0.20
    kg: {status: needs_construction}

  - name: electronics
    loader: electronics
    raw_path: data/raw/electronics/df_electronics.csv
    split: {strategy: random, val_size: 0.1, test_size: 0.2, random_state: 200, store_dir: data/splits/electronics}
    topk: [5, 10]
    tail_fraction: 0.20
    kg: {status: needs_construction}

  - name: rentrunway
    loader: rentrunway
    raw_path: data/raw/rentrunway/renttherunway_final_data.json
    split: {strategy: random, val_size: 0.1, test_size: 0.2, random_state: 200, store_dir: data/splits/rentrunway}
    topk: [5, 10]
    tail_fraction: 0.20
    kg: {status: needs_construction}

  - name: ambar
    loader: ambar
    raw_path: data/raw/ambar/ratings_info.csv
    split: {strategy: random, val_size: 0.1, test_size: 0.2, random_state: 200, store_dir: data/splits/ambar}
    topk: [5, 10]
    tail_fraction: 0.20
    kg: {status: needs_construction}

  - name: lastfm1k
    loader: lastfm1k_artist
    raw_path: data/raw/lastfm1k/userid-timestamp-artid-artname-traid-traname.tsv
    filter: {min_item_interactions: 20}   # 961,417 tracks -> 35,474 artists; see README "LastFM1K memory"
    split: {strategy: random, val_size: 0.1, test_size: 0.2, random_state: 200, store_dir: data/splits/lastfm1k}
    topk: [5, 10]
    tail_fraction: 0.20
    kg: {status: needs_construction}

  - name: amazon_digital_music
    loader: amazon_digital_music
    raw_path: data/raw/amazon_digital_music/Digital_Music.jsonl
    split: {strategy: random, val_size: 0.1, test_size: 0.2, random_state: 200, store_dir: data/splits/amazon_digital_music}
    topk: [5, 10]
    tail_fraction: 0.20
    kg: {status: unsupported}

models:
  # electronics/rentrunway/amazon_digital_music are far too sparse for the default
  # precondition (79.6% / 68.0% / 87.3% of users have <2 interactions). Rather than skip
  # them, this override lets EBPR/UBPR/UEBPR actually attempt training there: a much lower
  # sparsity floor (0.05 — all three clear it) plus a smaller item neighborhood (5, down
  # from 20) so create_neighborhood's cosine-similarity signal isn't diluted by
  # mostly-empty co-occurrence on this data. Expected to produce a real but weak/degenerate
  # explainability signal, not a crash — same class of disclosed finding as the AR
  # explainer's model_fidelity=0.0 on these same three datasets. Defined once and aliased
  # below so EBPR/UBPR/UEBPR share the exact same override.
  - name: EBPR
    tier: 1
    adapter: ebpr
    variant: EBPR
    applies_to: all_datasets
    hyperparameters: {num_epoch: 50, batch_size: 512, lr: 0.001, num_latent: 8, neighborhood: 20, optimizer: adam}
    precondition: {min_fraction_users_with_2plus: 0.5}
    dataset_overrides: &sparse_ebpr_overrides
      electronics:
        hyperparameters: {num_epoch: 50, batch_size: 512, lr: 0.001, num_latent: 8, neighborhood: 5, optimizer: adam}
        precondition: {min_fraction_users_with_2plus: 0.05}
      rentrunway:
        hyperparameters: {num_epoch: 50, batch_size: 512, lr: 0.001, num_latent: 8, neighborhood: 5, optimizer: adam}
        precondition: {min_fraction_users_with_2plus: 0.05}
      amazon_digital_music:
        hyperparameters: {num_epoch: 50, batch_size: 512, lr: 0.001, num_latent: 8, neighborhood: 5, optimizer: adam}
        precondition: {min_fraction_users_with_2plus: 0.05}

  - name: UBPR
    tier: 1
    adapter: ebpr
    variant: UBPR
    applies_to: all_datasets
    hyperparameters: {num_epoch: 50, batch_size: 512, lr: 0.001, num_latent: 8, neighborhood: 20, optimizer: adam}
    precondition: {min_fraction_users_with_2plus: 0.5}
    dataset_overrides: *sparse_ebpr_overrides

  - name: UEBPR
    tier: 1
    adapter: ebpr
    variant: UEBPR
    applies_to: all_datasets
    hyperparameters: {num_epoch: 50, batch_size: 512, lr: 0.001, num_latent: 8, neighborhood: 20, optimizer: adam}
    precondition: {min_fraction_users_with_2plus: 0.5}
    dataset_overrides: *sparse_ebpr_overrides

  - name: PGPR
    tier: 1
    adapter: pgpr
    applies_to: [ml100k, ml1m]
    hyperparameters: {transe_epochs: 30, transe_batch_size: 64, agent_epochs: 50, agent_batch_size: 32}
    precondition: {min_kg_triples: 1000}

  # Tier 2 — the predecessor pipeline's original baselines (AUDIT.md section 1.1). Trivial
  # cost to wire in (see the plan's Tier 2 cost assessment): one RecBoleModelAdapter,
  # parameterized here.
  - name: Pop
    tier: 2
    adapter: recbole
    recbole_model: Pop
    applies_to: all_datasets
    hyperparameters: {epochs: 1}  # AUDIT.md 4.6: pre-existing patch, preserved

  - name: BPR
    tier: 2
    adapter: recbole
    recbole_model: BPR
    applies_to: all_datasets
    hyperparameters: {}

  - name: MultiVAE
    tier: 2
    adapter: recbole
    recbole_model: MultiVAE
    applies_to: all_datasets
    hyperparameters: {}

  - name: NeuMF
    tier: 2
    adapter: recbole
    recbole_model: NeuMF
    applies_to: all_datasets
    hyperparameters: {}

  - name: SLIM
    tier: 2
    adapter: recbole
    recbole_model: SLIMElastic
    applies_to: all_datasets
    hyperparameters: {epochs: 50}  # AUDIT.md 4.6/5.3: pre-existing convergence patch, preserved

explainers:
  - name: AR
    adapter: recoxplainer_ar
    applies_to_models: [Pop, BPR, MultiVAE, NeuMF, SLIM]
    hyperparameters:
      min_support: 0.001
      max_len: 2
      metric: lift
      min_threshold: 0.001
      min_confidence: 0.001
      min_lift: 0.001

  - name: KNN
    adapter: recoxplainer_knn
    applies_to_models: [Pop, BPR, MultiVAE, NeuMF, SLIM]
    hyperparameters: {knn: 10}

metrics:
  accuracy: [ndcg, map]
  # gini/variance here are USER-side (inequality of per-user NDCG); the item_* /
  # tail_* entries are item-side (how exposure spreads over the catalog).
  fairness: [gini, variance, entropy, arp, arp_normalized, tail_coverage,
             item_coverage, item_exposure_gini, tail_item_coverage, tail_exposure_share]
  explanation: [fidelity, tail_coverage, diversity, explanation_arp, coverage, personalization]

statistics:
  tests: [friedman, quade, nemenyi, kendall_w]
  alpha: 0.05
